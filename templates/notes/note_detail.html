{% extends "base.html" %}

{% block title %}
{{ note.title }}
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="mb-3">
                        {{ note.title }}
                    </h1>

                    <p class="text-muted">
                        Created: {{ note.created_at }}
                    </p>

                    <hr>

                    <div class="mb-4">
                        {{ note.content|linebreaks }}
                    </div>

                    <a
                        href="{% url 'note_list' %}"
                        class="btn btn-secondary"
                    >
                        Back to Notes
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

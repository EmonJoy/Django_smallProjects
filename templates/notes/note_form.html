{% extends "base.html" %}

{% block title %}
Create Note
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-4">Create Note</h2>

                    <form method="POST">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Note
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
